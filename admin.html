<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>তাজা ও খাঁটি মার্ট - Admin</title>

<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;
  background:#f4f7f5;
  color:#17221a;
}

header{
  background:#0d6b3d;
  color:white;
  padding:18px;
}

header h1{
  margin:0;
  font-size:23px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0001;
}

h2{
  margin-top:0;
  color:#0d6b3d;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccd8d0;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  margin:4px;
  cursor:pointer;
  font-size:15px;
}

.primary{
  background:#0d6b3d;
  color:white;
}

.danger{
  background:#c62828;
  color:white;
}

.gray{
  background:#e7ece9;
}

.product{
  border:1px solid #dbe4df;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  overflow:hidden;
}

.product img{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  float:left;
  margin-right:12px;
}

.clear{
  clear:both;
}

.hidden{
  display:none;
}

.status{
  padding:10px;
  border-radius:9px;
  margin:10px 0;
  background:#eef7f1;
}

.login{
  max-width:450px;
  margin:50px auto;
}

.small{
  color:#666;
  font-size:13px;
}

.row{
  display:flex;
  gap:8px;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:10px 0;
}

@media(max-width:600px){
  .row{
    display:block;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <h1>তাজা ও খাঁটি মার্ট — Admin Panel</h1>
  </div>
</header>

<!-- LOGIN -->
<div id="loginPage" class="container">

  <div class="card login">

    <h2>🔐 Admin Login</h2>

    <p class="small">
      Firebase Email/Password দিয়ে লগইন করুন।
    </p>

    <input ঋদ্ধ
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginStatus"></div>

  </div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPage" class="container hidden">

  <div class="card">

    <div class="row">

      <div>
        <b>Admin Panel</b>
        <div id="userEmail" class="small"></div>
      </div>

      <button class="danger" onclick="logout()">
        Logout
      </button>

    </div>

  </div>


  <!-- STORE INFORMATION -->
  <div class="card">

    <h2>🏪 দোকানের তথ্য</h2>

    <label>দোকানের নাম</label>
    <input id="storeName">

    <label>Tagline</label>
    <input id="storeTagline">

    <label>ফোন</label>
    <input id="storePhone">

    <label>WhatsApp</label>
    <input id="storeWhatsapp">

    <label>bKash</label>
    <input id="storeBkash">

    <label>Nagad</label>
    <input id="storeNagad">

    <label>Email</label>
    <input id="storeEmail">

    <label>ঠিকানা</label>
    <textarea id="storeAddress"></textarea>

    <label>ঢাকার ভিতরে Delivery Charge</label>
    <input id="deliveryDhaka" type="number">

    <label>ঢাকার বাইরে Delivery Charge</label>
    <input id="deliveryOutside" type="number">

    <label>কত টাকার অর্ডারে Free Delivery</label>
    <input id="freeDelivery" type="number">

    <button class="primary" onclick="saveStoreInfo()">
      💾 দোকানের তথ্য সংরক্ষণ
    </button>

    <div id="storeStatus"></div>

  </div>


  <!-- PRODUCT FORM -->
  <div class="card">

    <h2 id="formTitle">➕ নতুন পণ্য যোগ করুন</h2>

    <input id="productId" type="hidden">

    <label>পণ্যের নাম</label>
    <input id="pName" placeholder="যেমন: ইরানি জাহেদি খেজুর">

    <label>English Name</label>
    <input id="pEnglish" placeholder="English product name">

    <label>Category</label>
    <input id="pCategory" placeholder="খেজুর / বাদাম / ফল">

    <label>Badge</label>
    <input id="pBadge" placeholder="জনপ্রিয় / নতুন">

    <label>ছবির URL</label>
    <input id="pImage" placeholder="https://...">

    <label>বর্ণনা</label>
    <textarea id="pDescription"></textarea>

    <label>Origin</label>
    <input id="pOrigin">

    <label>Features</label>
    <textarea id="pFeatures" placeholder="এক লাইনে একটি feature লিখতে পারো"></textarea>

    <label>Rating</label>
    <input id="pRating" type="number" step="0.1" value="5">

    <label>Reviews Count</label>
    <input id="pReviews" type="number" value="0">

    <label>
      <input id="pStock" type="checkbox" checked style="width:auto">
      Stock আছে
    </label>

    <br>

    <label>
      <input id="pFeatured" type="checkbox" style="width:auto">
      Featured Product
    </label>

    <h3>📦 ওজন ও দাম</h3>

    <label>ওজন ১</label>
    <input id="w1" placeholder="500g">

    <label>দাম ১</label>
    <input id="p1" type="number">

    <label>পুরনো দাম ১</label>
    <input id="o1" type="number">

    <label>ওজন ২</label>
    <input id="w2" placeholder="1kg">

    <label>দাম ২</label>
    <input id="p2" type="number">

    <label>পুরনো দাম ২</label>
    <input id="o2" type="number">

    <button class="primary" onclick="saveProduct()">
      💾 পণ্য সংরক্ষণ
    </button>

    <button class="gray" onclick="clearForm()">
      নতুন করে লিখুন
    </button>

    <div id="productStatus"></div>

  </div>


  <!-- PRODUCTS -->
  <div class="card">

    <h2>📦 সব পণ্য</h2>

    <button class="primary" onclick="loadProducts()">
      🔄 পণ্য Refresh
    </button>

    <div id="productsList">
      Loading...
    </div>

  </div>


  <!-- ORDERS -->
  <div class="card">

    <h2>🛒 অর্ডার</h2>

    <button class="primary" onclick="loadOrders()">
      🔄 অর্ডার Refresh
    </button>

    <div id="ordersList">
      অর্ডার লোড হচ্ছে...
    </div>

  </div>

</div>


<script>

/* =========================
   FIREBASE CONFIG
========================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAeFSsPm1IxJs25w7B1Rwa98sBhZQYqF7s",
  authDomain: "taja-mart-f2246.firebaseapp.com",
  projectId: "taja-mart-f2246",
  storageBucket: "taja-mart-f2246.firebasestorage.app",
  messagingSenderId: "147195806814",
  appId: "1:147195806814:web:710a33b7468c7d6ff860cf",
  measurementId: "G-NFG1FFYJ62"
};


/* =========================
   FIREBASE START
========================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================
   LOGIN STATE
========================= */

auth.onAuthStateChanged(function(user){

  if(user){

    document.getElementById("loginPage")
      .classList.add("hidden");

    document.getElementById("adminPage")
      .classList.remove("hidden");

    document.getElementById("userEmail")
      .innerText = user.email || "";

    loadStoreInfo();
    loadProducts();
    loadOrders();

  }else{

    document.getElementById("loginPage")
      .classList.remove("hidden");

    document.getElementById("adminPage")
      .classList.add("hidden");

  }

});


/* =========================
   LOGIN
========================= */

function login(){
  const status = document.getElementById("loginStatus");

  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(!email || !password){
      status.innerText = "Email ও Password দিন।";
      return;
    }

    status.innerText = "Login হচ্ছে...";

    if(typeof auth === "undefined" || !auth){
      status.innerText = "Firebase Auth চালু হয়নি।";
      return;
    }

    auth.signInWithEmailAndPassword(email,password)
      .then(function(){
        status.innerText = "Login সফল হয়েছে।";
      })
      .catch(function(error){
        status.innerText =
          "Login সমস্যা: " + (error.code || "") + " — " + error.message;
      });

  } catch(error) {
    status.innerText =
      "JavaScript সমস্যা: " + error.message;
  }
}

/* =========================
   LOGOUT
========================= */

function logout(){

  auth.signOut();

}


/* =========================
   STORE INFO LOAD
========================= */

function loadStoreInfo(){

  db.collection("storeInfo")
    .doc("main")
    .get()

    .then(function(doc){

      if(!doc.exists) return;

      const d = doc.data();

      document.getElementById("storeName").value =
        d.name || "";

      document.getElementById("storeTagline").value =
        d.tagline || "";

      document.getElementById("storePhone").value =
        d.phone || "";

      document.getElementById("storeWhatsapp").value =
        d.whatsapp || "";

      document.getElementById("storeBkash").value =
        d.bKash || "";

      document.getElementById("storeNagad").value =
        d.nagad || "";

      document.getElementById("storeEmail").value =
        d.email || "";

      document.getElementById("storeAddress").value =
        d.address || "";

      document.getElementById("deliveryDhaka").value =
        d.deliveryChargeDhaka || 60;

      document.getElementById("deliveryOutside").value =
        d.deliveryChargeOutside || 120;

      document.getElementById("freeDelivery").value =
        d.freeDeliveryThreshold || 2500;

    })

    .catch(function(error){

      document.getElementById("storeStatus")
        .innerText =
        "তথ্য লোড হয়নি: " + error.message;

    });

}


/* =========================
   STORE INFO SAVE
========================= */

function saveStoreInfo(){

  const data = {

    name:
      document.getElementById("storeName").value.trim(),

    tagline:
      document.getElementById("storeTagline").value.trim(),

    phone:
      document.getElementById("storePhone").value.trim(),

    whatsapp:
      document.getElementById("storeWhatsapp").value.trim(),

    bKash:
      document.getElementById("storeBkash").value.trim(),

    nagad:
      document.getElementById("storeNagad").value.trim(),

    email:
      document.getElementById("storeEmail").value.trim(),

    address:
      document.getElementById("storeAddress").value.trim(),

    deliveryChargeDhaka:
      Number(document.getElementById("deliveryDhaka").value) || 0,

    deliveryChargeOutside:
      Number(document.getElementById("deliveryOutside").value) || 0,

    freeDeliveryThreshold:
      Number(document.getElementById("freeDelivery").value) || 0

  };

  db.collection("storeInfo")
    .doc("main")
    .set(data,{merge:true})

    .then(function(){

      document.getElementById("storeStatus")
        .innerText =
        "✅ দোকানের তথ্য সংরক্ষণ হয়েছে।";

    })

    .catch(function(error){

      document.getElementById("storeStatus")
        .innerText =
        "❌ সমস্যা: " + error.message;

    });

}


/* =========================
   PRODUCT SAVE
========================= */

function saveProduct(){

  const id =
    document.getElementById("productId").value.trim();

  const name =
    document.getElementById("pName").value.trim();

  if(!name){

    alert("পণ্যের নাম দিন।");
    return;

  }

  const weightOptions = [];

  const w1 =
    document.getElementById("w1").value.trim();

  const p1 =
    Number(document.getElementById("p1").value) || 0;

  const o1 =
    Number(document.getElementById("o1").value) || 0;

  if(w1){

    weightOptions.push({

      label:w1,
      weightInGrams:
        parseWeight(w1),

      price:p1,
      originalPrice:o1

    });

  }

  const w2 =
    document.getElementById("w2").value.trim();

  const p2 =
    Number(document.getElementById("p2").value) || 0;

  const o2 =
    Number(document.getElementById("o2").value) || 0;

  if(w2){

    weightOptions.push({

      label:w2,
      weightInGrams:
        parseWeight(w2),

      price:p2,
      originalPrice:o2

    });

  }

  const product = {

    id:
      id || makeId(),

    name:name,

    englishName:
      document.getElementById("pEnglish").value.trim(),

    category:
      document.getElementById("pCategory").value.trim(),

    badge:
      document.getElementById("pBadge").value.trim(),

    isFeatured:
      document.getElementById("pFeatured").checked,

    image:
      document.getElementById("pImage").value.trim(),

    description:
      document.getElementById("pDescription").value.trim(),

    origin:
      document.getElementById("pOrigin").value.trim(),

    features:
      document.getElementById("pFeatures").value
        .split("\n")
        .map(function(x){return x.trim();})
        .filter(Boolean),

    inStock:
      document.getElementById("pStock").checked,

    rating:
      Number(document.getElementById("pRating").value) || 5,

    reviewsCount:
      Number(document.getElementById("pReviews").value) || 0,

    weightOptions:weightOptions

  };

  db.collection("products")
    .doc(product.id)
    .set(product)

    .then(function(){

      document.getElementById("productStatus")
        .innerText =
        "✅ পণ্য Firebase-এ সংরক্ষণ হয়েছে।";

      clearForm();
      loadProducts();

    })

    .catch(function(error){

      document.getElementById("productStatus")
        .innerText =
        "❌ সমস্যা: " + error.message;

    });

}


/* =========================
   WEIGHT PARSER
========================= */

function parseWeight(value){

  value = String(value).toLowerCase().trim();

  if(value.includes("kg")){

    const n =
      parseFloat(value.replace("kg",""));

    return n * 1000;

  }

  if(value.includes("g")){

    const n =
      parseFloat(value.replace("g",""));

    return n;

  }

  return 0;

}


/* =========================
   RANDOM ID
========================= */

function makeId(){

  return "p" +
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .substring(2,7);

}


/* =========================
   LOAD PRODUCTS
========================= */

function loadProducts(){

  const box =
    document.getElementById("productsList");

  box.innerHTML = "লোড হচ্ছে...";

  db.collection("products")
    .get()

    .then(function(snapshot){

      box.innerHTML = "";

      if(snapshot.empty){

        box.innerHTML =
          "<p>কোনো পণ্য নেই।</p>";

        return;

      }

      snapshot.forEach(function(doc){

        const p = doc.data();

        if(p.id === "setup"){
          return;
        }

        let priceText = "";

        if(Array.isArray(p.weightOptions)){

          p.weightOptions.forEach(function(w){

            priceText +=
              w.label + " — ৳" +
              w.price + "<br>";

          });

        }

        const div =
          document.createElement("div");

        div.className = "product";

        div.innerHTML = `

          ${
            p.image
            ? `<img src="${escapeHtml(p.image)}">`
            : ""
          }

          <b>${escapeHtml(p.name || "")}</b>

          <div class="small">
            ${escapeHtml(p.category || "")}
          </div>

          <div>
            ${priceText}
          </div>

          <div class="small">
            ${
              p.inStock
              ? "🟢 Stock আছে"
              : "🔴 Stock নেই"
            }
          </div>

          <br>

          <button
            class="primary"
            onclick='editProduct(${JSON.stringify(p)})'>
            ✏️ Edit
          </button>

          <button
            class="danger"
            onclick='deleteProduct("${escapeHtml(p.id)}")'>
            🗑️ Delete
          </button>

          <div class="clear"></div>

        `;

        box.appendChild(div);

      });

    })

    .catch(function(error){

      box.innerHTML =
        "❌ পণ্য লোড হয়নি: " +
        error.message;

    });

}


/* =========================
   EDIT PRODUCT
========================= */

function editProduct(p){

  document.getElementById("productId").value =
    p.id || "";

  document.getElementById("pName").value =
    p.name || "";

  document.getElementById("pEnglish").value =
    p.englishName || "";

  document.getElementById("pCategory").value =
    p.category || "";

  document.getElementById("pBadge").value =
    p.badge || "";

  document.getElementById("pImage").value =
    p.image || "";

  document.getElementById("pDescription").value =
    p.description || "";

  document.getElementById("pOrigin").value =
    p.origin || "";

  document.getElementById("pFeatures").value =
    Array.isArray(p.features)
    ? p.features.join("\n")
    : "";

  document.getElementById("pRating").value =
    p.rating || 5;

  document.getElementById("pReviews").value =
    p.reviewsCount || 0;

  document.getElementById("pStock").checked =
    p.inStock !== false;

  document.getElementById("pFeatured").checked =
    p.isFeatured === true;

  const w =
    Array.isArray(p.weightOptions)
    ? p.weightOptions
    : [];

  if(w[0]){

    document.getElementById("w1").value =
      w[0].label || "";

    document.getElementById("p1").value =
      w[0].price || "";

    document.getElementById("o1").value =
      w[0].originalPrice || "";

  }

  if(w[1]){

    document.getElementById("w2").value =
      w[1].label || "";

    document.getElementById("p2").value =
      w[1].price || "";

    document.getElementById("o2").value =
      w[1].originalPrice || "";

  }

  document.getElementById("formTitle")
    .innerText =
    "✏️ পণ্য Edit করুন";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE PRODUCT
========================= */

function deleteProduct(id){

  if(!confirm("এই পণ্যটি Delete করবেন?")){
    return;
  }

  db.collection("products")
    .doc(id)
    .delete()

    .then(function(){

      alert("পণ্য Delete হয়েছে।");

      loadProducts();

    })

    .catch(function(error){

      alert(
        "Delete সমস্যা: " +
        error.message
      );

    });

}


/* =========================
   CLEAR FORM
========================= */

function clearForm(){

  document.getElementById("productId").value = "";

  document.getElementById("pName").value = "";
  document.getElementById("pEnglish").value = "";
  document.getElementById("pCategory").value = "";
  document.getElementById("pBadge").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pDescription").value = "";
  document.getElementById("pOrigin").value = "";
  document.getElementById("pFeatures").value = "";

  document.getElementById("pRating").value = "5";
  document.getElementById("pReviews").value = "0";

  document.getElementById("pStock").checked = true;
  document.getElementById("pFeatured").checked = false;

  document.getElementById("w1").value = "";
  document.getElementById("p1").value = "";
  document.getElementById("o1").value = "";

  document.getElementById("w2").value = "";
  document.getElementById("p2").value = "";
  document.getElementById("o2").value = "";

  document.getElementById("formTitle")
    .innerText =
    "➕ নতুন পণ্য যোগ করুন";

}


/* =========================
   LOAD ORDERS
========================= */

function loadOrders(){

  const box =
    document.getElementById("ordersList");

  db.collection("orders")
    .get()

    .then(function(snapshot){

      if(snapshot.empty){

        box.innerHTML =
          "<p>এখনো কোনো অর্ডার নেই।</p>";

        return;

      }

      box.innerHTML = "";

      snapshot.forEach(function(doc){

        const o = doc.data();

        const div =
          document.createElement("div");

        div.className = "product";

        div.innerHTML = `

          <b>Order ID:</b>
          ${escapeHtml(doc.id)}

          <br><br>

          <b>Customer:</b>
          ${escapeHtml(o.name || "")}

          <br>

          <b>Phone:</b>
          ${escapeHtml(o.phone || "")}

          <br>

          <b>Total:</b>
          ৳${o.total || 0}

        `;

        box.appendChild(div);

      });

    })

    .catch(function(error){

      box.innerHTML =
        "অর্ডার লোড হয়নি: " +
        error.message;

    });

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

  return String(text || "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}// Firebase শুরু
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

</script>


</body>
</html>
